[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-psyco"
version = "0.1.0"
description = "Generate typed psycopg SQL statements and Pydantic models from PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
formatting = [
    "ruff>=0.9,<1",
    "sqlfluff>=3,<5",
]

[project.scripts]
get_sql_types = "typed_psyco.get_sql_types:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.390",
    "build>=1",
    "ruff>=0.9,<1",
    "sqlfluff>=3,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/typed_psyco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["postgres: requires TYPED_PSYCO_TEST_CONN_STR pointing at a disposable database"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
